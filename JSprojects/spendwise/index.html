<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">SpendWise</div>
        <h1>Smart Expense Tracker</h1>
        <p>Track your income, expenses, and savings</p>
    </header>

    <main>
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card total-card">
                <h3>Total Balance</h3>
                <div class="amount" id="total-balance">$0.00</div>
            </div>
            <div class="card income-card">
                <h3>Total Income</h3>
                <div class="amount" id="total-income">$0.00</div>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <div class="amount" id="total-expenses">$0.00</div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <section class="add-transaction">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-row">
                    <select id="type" name="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <input type="number" id="amount" name="amount" placeholder="Amount" step="0.01" required>
                </div>
                <input type="text" id="description" name="description" placeholder="Description" required>
                <select id="category" name="category">
                    <option value="food">Food</option>
                    <option value="rent">Rent</option>
                    <option value="shopping">Shopping</option>
                    <option value="salary">Salary</option>
                    <option value="other">Other</option>
                </select>
                <button type="submit" class="btn-add">Add Transaction</button>
            </form>
        </section>

        <!-- Transaction List -->
        <section class="transactions">
            <h2>Transactions</h2>
            <div class="search-filter">
                <input type="text" id="search" placeholder="Search transactions...">
                <select id="filter-category">
                    <option value="all">All Categories</option>
                    <option value="food">Food</option>
                    <option value="rent">Rent</option>
                    <option value="shopping">Shopping</option>
                    <option value="salary">Salary</option>
                    <option value="other">Other</option>
                </select>
                <button id="clear-filters" class="btn-clear">Clear</button>
            </div>
            <div id="transaction-list" class="transaction-list">
                <!-- Transactions will be populated here -->
                <div class="empty-state">
                    <p>No transactions yet. Add your first transaction!</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>SpendWise - Smart Expense Tracker</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
