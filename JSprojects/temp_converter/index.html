<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
</head>
<html>  
  <body>
    <div class="container">
      <h1 class="heading">Temperature Converter</h1>
      <div class="temp-container">
        <div class="temp-container">
          <div class="temp-row">
            <label>Celsius:</label>
            <input type="number" id="celsius" class="input" onchange="computeTemp(event)" name="celsius" placeholder="Enter Temperature">

            <label>Fahrenheit:</label>
            <input type="number" id="fahrenheit" class="input" onchange="computeTemp(event)" name="fahrenheit" placeholder="Enter Temperature">

            <label>Kelvin:</label>
            <input type="number" id="kelvin" class="input" onchange="computeTemp(event)"  name="kelvin"  placeholder="Enter Temperature">
          </div>
        </div>
      </div>
      <script src="script.js"></script>
  </body>
</html>
