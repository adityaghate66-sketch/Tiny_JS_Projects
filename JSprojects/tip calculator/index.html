<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
        
</head>

<body>
    <div class="container">
        <h1>Tip Calculator</h1>
        <p>Enter the bill amount and tip percentage to calculate total.</p>
        <label for="billamount">Bill Amount:</label>
        <input type="number" id="billamount" placeholder="Enter the bill amount">
        <br>
        <label for="tippercentage">Tip Percentage:</label>
        <input type="number" id="tippercentage" placeholder="Enter the tip percentage">
        <br>
        <button id="calc">Calculate</button>
        <br>
        <p>Total Amount: ₹ <span id="total"></span></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
