<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator | Phase 2 Tools</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <script type="module" src="script.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .tool-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        input[type="date"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .actions {
            display: flex;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }
        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .calculate {
            background: #667eea;
            color: white;
        }
        .calculate:hover {
            background: #764ba2;
        }
        .back-btn {
            background: #10b981;
            color: white;
            text-align: center;
        }
        .back-btn:hover {
            background: #059669;
        }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f0fdf4;
            border-radius: 8px;
            border-left: 4px solid #10b981;
        }
        .result-label {
            font-weight: 600;
            color: #166534;
            margin-bottom: 0.5rem;
        }
        .result-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #166534;
        }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="tool-container">
        <h2>📅 Age Calculator</h2>
        <div class="inputs">
            <div class="form-group">
                <label for="birth_date">Your Birth Date:</label>
                <input type="date" id="birth_date" data-field="birth_date" required>
            </div>
        </div>
        <div class="actions">
            <button class="btn calculate">Calculate Age</button>
            <a href="../index.html" class="btn back-btn">← Back</a>
        </div>
        <div class="result-box"></div>
    </div>

    <script type="module">
        import AgeCalculator from './script.js';

        document.addEventListener('DOMContentLoaded', () => {
            new AgeCalculator();
        });
    </script>
</body>
</html>
