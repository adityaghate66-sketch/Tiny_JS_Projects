<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator | Phase 2 Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .tool-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #f5576c;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #f5576c;
        }
        .tip-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
            justify-content: center;
        }
        .btn-tip {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            background: #e5e7eb;
            color: #333;
            transition: all 0.2s;
        }
        .btn-tip:hover {
            background: #f5576c;
            color: white;
        }
        .actions {
            margin: 1.5rem 0;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .back-btn {
            text-align: center;
            background: #10b981;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f0fdf4;
            border-radius: 8px;
            border-left: 4px solid #10b981;
        }
        .result-label {
            font-weight: 600;
            color: #166534;
            margin-bottom: 0.5rem;
        }
        .result-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #166534;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .total-row {
            font-weight: 600;
            border-top: 2px solid #10b981;
        }
    </style>
</head>
<body>
    <div class="tool-container">
        <h2>💰 Tip Calculator</h2>
        <div class="inputs">
            <div class="form-group">
                <label for="bill">Bill Amount ($):</label>
                <input type="number" id="bill" data-field="bill" placeholder="Enter bill amount" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="people">Number of People:</label>
                <input type="number" id="people" data-field="people" placeholder="1" min="1" value="1">
            </div>
        </div>
        <div class="tip-buttons" id="tip-buttons"></div>
        <div class="actions">
            <button class="btn calculate">Calculate Tip</button>
            <a href="../index.html" class="btn back-btn">← Back</a>
        </div>
        <div class="result-box"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
